<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commute to AS+P</title>
<meta name="description" content="How far you get to Hedderichstraße 108–110, Frankfurt, by public transport, adjusted for how reliable the trains and buses really are.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E1A; --panel: rgba(11, 14, 26, .92); --text: #E6E8F0; --text2: #8A90A8; --rule: #1E2440;
    --blue: #596FFF; --aqua: #26FFDB; --pink: #FF3396;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 400 15px/1.45 'IBM Plex Sans', system-ui, sans-serif; }
  #map { position: fixed; inset: 0; background: var(--bg); }
  .leaflet-container { background: var(--bg); font: inherit; }
  .leaflet-control-attribution { background: rgba(11,14,26,.75) !important; color: var(--text2) !important; font-size: 11px; }
  .leaflet-control-attribution a { color: var(--text2) !important; }
  .leaflet-bar a { background: var(--panel); color: var(--text); border-color: var(--rule); }
  .leaflet-bar a:hover { background: #151B36; color: var(--text); }

  #panel {
    position: fixed; top: 16px; left: 16px; width: 380px; max-height: calc(100% - 32px); overflow: auto;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; padding: 22px 22px 18px;
    backdrop-filter: blur(8px); z-index: 1000; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .brand img { height: 26px; }
  .lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
  .lang button { font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 1px; color: var(--text2); background: none; border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .lang button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .kicker { font: 600 11px 'Chakra Petch', sans-serif; letter-spacing: 3px; color: var(--text2); text-transform: uppercase; }
  h1 { font: 700 27px/1.15 'Chakra Petch', sans-serif; margin: 6px 0 6px; letter-spacing: .3px; }
  .lead { color: var(--text2); margin: 0 0 18px; font-size: 14px; }
  .ctl { margin: 18px 0 6px; }
  .ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .ctl-head label { font-weight: 600; font-size: 14px; }
  .val { font: 700 15px 'JetBrains Mono', monospace; color: var(--aqua); white-space: nowrap; }
  .hint { color: var(--text2); font-size: 12.5px; margin-top: 4px; min-height: 18px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 6px 0 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--rule), #2F3A8B); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--rule), #2F3A8B); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--text); border: 4px solid var(--blue); margin-top: -8px; box-shadow: 0 0 12px rgba(89,111,255,.6); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 4px solid var(--blue); box-shadow: 0 0 12px rgba(89,111,255,.6); }
  input[type=range]:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 4px; }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .modes span { font-size: 12px; color: var(--text2); background: #11162B; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 9px; }
  .modes b { font: 700 12px 'JetBrains Mono', monospace; color: var(--text); margin-left: 4px; }
  .modes .lbl { background: none; border: 0; padding: 2px 0; }
  .ticks { display: flex; justify-content: space-between; font: 500 10.5px 'JetBrains Mono', monospace; color: var(--text2); margin-top: -2px; }

  .legend { display: grid; gap: 3px; margin: 20px 0 4px; }
  .legend div { height: 10px; border-radius: 2px; }
  .legend-l { display: grid; font: 500 11px 'JetBrains Mono', monospace; color: var(--text2); }
  .view { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--rule); border-radius: 12px; padding: 3px; margin: 2px 0 4px; }
  .view button { font: 600 13px 'IBM Plex Sans', sans-serif; color: var(--text2); background: none; border: 0; border-radius: 9px; padding: 8px 6px; cursor: pointer; }
  .view button[aria-pressed="true"] { background: #1A2147; color: var(--text); }
  .view button[data-view="risk"][aria-pressed="true"] { background: rgba(255, 51, 150, .16); color: #FF86BD; }
  .view button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .legend-l span { text-align: left; }

  .stats { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .stats h2 { font: 600 12px 'Chakra Petch', sans-serif; letter-spacing: 2px; color: var(--text2); margin: 0 0 10px; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: 54px 1fr 74px; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .row .k { font: 500 12px 'JetBrains Mono', monospace; color: var(--text2); }
  .bar { position: relative; height: 12px; background: #11162B; border-radius: 3px; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; transition: width .35s ease; }
  .bar i.ghost { background: transparent; border: 1px dashed #4B5DD7; }
  .row .v { font: 700 13px 'JetBrains Mono', monospace; text-align: right; }
  .row .d { display: block; font-size: 11px; color: var(--pink); font-weight: 500; }
  .note { color: var(--text2); font-size: 12px; margin-top: 8px; }
  .note b { color: var(--text); font-weight: 500; }

  details { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 12px; color: var(--text2); font-size: 12.5px; }
  summary { cursor: pointer; color: var(--text); font-weight: 500; font-size: 13px; }
  details p { margin: 8px 0; }
  .foot { margin-top: 12px; color: var(--text2); font-size: 11.5px; }
  .foot a { color: var(--text2); }

  /* the office: the logo inside a white disc */
  .office { width: 50px; height: 50px; border-radius: 50%; background: #fff; border: 3px solid #000; display: grid; place-items: center;
            box-shadow: 0 0 0 3px rgba(255,255,255,.28), 0 0 20px rgba(255,255,255,.4); }
  .leaflet-container .leaflet-marker-pane .office img { width: 34px; height: auto; display: block; }  /* beats leaflet.css width: auto */

  #corner { position: fixed; right: 22px; bottom: 44px; z-index: 900; opacity: .9; pointer-events: none; }
  #corner img { height: 34px; display: block; }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); border: 1px solid var(--rule); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
  .pop-t { font: 700 22px 'JetBrains Mono', monospace; }
  .pop-s { color: var(--text2); font-size: 12px; }

  @media (max-width: 720px) {
    #panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 48%; border-radius: 18px 18px 0 0; padding: 16px; }
    .leaflet-control-zoom { display: none; }
    h1 { font-size: 22px; }
    .lead { display: none; }
    #corner { top: 16px; bottom: auto; right: auto; left: 16px; }
    #corner img { height: 26px; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of travel times to the office"></div>
<div id="corner"><img src="asp_logo_white.png" alt="AS+P"></div>

<aside id="panel">
  <div class="brand"><span class="kicker" data-i="kicker"></span>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button></div></div>
  <h1 data-i="title"></h1>
  <p class="lead" data-i="lead"></p>

  <div class="view" role="group" aria-label="View">
    <button type="button" data-view="time" data-i="vTime"></button><button type="button" data-view="risk" data-i="vRisk"></button>
  </div>

  <div class="ctl">
    <div class="ctl-head"><label for="rel" data-i="rel"></label><span class="val" id="relv"></span></div>
    <input id="rel" type="range" min="0" max="4" step="1" value="3" aria-describedby="relh">
    <div class="ticks"><span data-i="tt"></span><span>1/2</span><span>4/5</span><span>9/10</span><span>19/20</span></div>
    <div class="hint" id="relh"></div>
    <div class="modes" id="modes" aria-live="polite"></div>
  </div>

  <div class="ctl">
    <div class="ctl-head"><label for="arr" data-i="arr"></label><span class="val" id="arrv"></span></div>
    <input id="arr" type="range" min="0" max="12" step="1" value="6">
    <div class="ticks"><span>07:00</span><span>08:00</span><span>09:00</span><span>10:00</span></div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="legend-l" id="legend-l"></div>

  <div class="stats">
    <h2 data-i="people"></h2>
    <div id="rows"></div>
    <div class="note" data-i="note"></div>
  </div>

  <details>
    <summary data-i="how"></summary>
    <p data-i="how1"></p>
    <p data-i="how2"></p>
    <p data-i="how3"></p>
  </details>
  <div class="foot" data-i="foot"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-contour@4.0.2/dist/d3-contour.min.js"></script>
<script>
const BANDS = [20, 30, 40, 50, 60];
const COLORS = ["#26FFDB", "#12DDBE", "#07B89C", "#05927B", "#066E5E"];   // 20 … 60 min, aqua scale
const FILL = [.38, .31, .25, .20, .16];                                   // translucent, nearest strongest
// delay risk: minutes earlier you must leave than the timetable says (pink scale)
const RISK = [5, 10, 20], RISK_COLORS = ["#AC1E63", "#D5287C", "#FF3396"], RISK_FILL = [.22, .30, .40];
const T = {
  en: {
    kicker: "Commute map · Frankfurt", title: "How far is the office, really?",
    lead: "Door-to-door by public transport to Hedderichstraße 108–110 on a weekday morning, and how the map shrinks once you account for delays and cancellations.",
    rel: "I need to be on time", tt: "timetable", arr: "Arrive at the office by", people: "People who live within",
    note: "Dashed outline: the same with timetable times. Click anywhere on the map for the travel time from there.",
    how: "How this is calculated",
    how1: "For every arrival time, a reverse search over the weekday timetable (Tuesday 20 Oct 2026) finds the latest moment you can leave home and still be at the door in time. Walking is 4.8 km/h along a path 1.3× the straight line, up to 1 km to the first stop; changing vehicles takes at least 2 minutes.",
    how2: "<b>Reliability</b> pushes every leg's arrival back by the delay that is not exceeded on that share of weekday trips, at that stop, on that line, in that hour, plus the expected wait from cancellations. Delays were measured from operators' live data, 24 Sep–16 Oct 2026. The next vehicle is assumed to leave on time, so a late train can cost you the connection; the route then switches to whatever you can still catch, a later train of the same line or a different line or mode. Each leg is buffered on its own, so long trips with changes are estimated cautiously.",
    how3: "Travel time includes waiting at the end if the last vehicle arrives early. Population: Zensus 2022, 100 m grid.",
    foot: "Data: DELFI / gtfs.de (CC BY-SA 4.0), Zensus 2022, © OpenStreetMap contributors, basemap © Esri.",
    map: "Map of travel times to the office", doc: "Commute to AS+P",
    buffer: "Average delay per leg:",
    vTime: "Travel time", vRisk: "Delay risk",
    riskPeople: "People who must leave earlier",
    riskRows: ["+5 min", "+10 min", "+20 min"],
    riskLegend: ["+5", "+10", "+20 min or out of reach"],
    riskNote: "Pink: how much earlier you must leave than the timetable says, to be on time as often as chosen above. Outlines: travel time bands.",
    riskOff: "Pick a reliability level above “timetable” to see where delays cost the most.",
    vs: d => d >= 99 ? "out of reach at this reliability" : `+${d} min vs timetable`,
    modes: { "S-Bahn": "S-Bahn", "Regional rail": "Regional", "U-Bahn": "U-Bahn", "Tram": "Tram", "Bus": "Bus" },
    levels: ["Timetable", "1 in 2 days", "4 in 5 days", "9 in 10 days", "19 in 20 days"],
    hints: ["Timetable times: what the journey planner promises.",
            "On time on a typical day: every other morning goes worse.",
            "On time 4 mornings out of 5: about once a week you are late.",
            "On time 9 mornings out of 10: about twice a month you are late.",
            "On time 19 mornings out of 20: about once a month you are late."],
    num: n => n >= 1e6 ? (n / 1e6).toFixed(2) + " M" : Math.round(n / 1000) + "k",
    leave: (t, tt) => `leave by ${t} · timetable says ${tt} min`,
    far: tt => tt <= 60 ? `timetable: ${tt} min` : "or too far to walk to a stop",
  },
  de: {
    kicker: "Pendelkarte · Frankfurt", title: "Wie weit ist das Büro wirklich?",
    lead: "Von Tür zu Tür mit Bus und Bahn zur Hedderichstraße 108–110 an einem Werktagmorgen – und wie die Karte schrumpft, wenn man Verspätungen und Ausfälle einrechnet.",
    rel: "Ich muss pünktlich sein", tt: "Fahrplan", arr: "Im Büro sein um", people: "Einwohner innerhalb von",
    note: "Gestrichelt: dasselbe nach Fahrplan. Klicken Sie auf die Karte, um die Fahrzeit von dort zu sehen.",
    how: "So wird gerechnet",
    how1: "Für jede Ankunftszeit sucht ein Rückwärts-Routing im Werktagsfahrplan (Dienstag, 20.10.2026) den spätesten Zeitpunkt, zu dem man zu Hause losgehen kann und trotzdem rechtzeitig ankommt. Fußwege: 4,8 km/h auf einem Weg, der 1,3-mal so lang ist wie die Luftlinie, bis zu 1 km zur ersten Haltestelle; ein Umstieg dauert mindestens 2 Minuten.",
    how2: "<b>Zuverlässigkeit</b> verschiebt die Ankunft jedes Abschnitts um die Verspätung, die bei diesem Anteil der Werktagsfahrten nicht überschritten wird – an dieser Haltestelle, auf dieser Linie, in dieser Stunde –, plus die erwartete Wartezeit durch Ausfälle. Die Verspätungen stammen aus den Echtzeitdaten der Verkehrsunternehmen, 24.09.–16.10.2026. Das Anschlussfahrzeug fährt im Modell pünktlich ab, eine Verspätung kann also den Anschluss kosten; dann nimmt die Route, was noch erreichbar ist: einen späteren Zug derselben Linie oder eine andere Linie bzw. ein anderes Verkehrsmittel. Jeder Abschnitt bekommt seinen eigenen Puffer, Fahrten mit Umstiegen sind daher vorsichtig geschätzt.",
    how3: "Die Fahrzeit enthält auch Wartezeit am Ziel, wenn das letzte Fahrzeug früher ankommt. Bevölkerung: Zensus 2022, 100-m-Raster.",
    foot: "Daten: DELFI / gtfs.de (CC BY-SA 4.0), Zensus 2022, © OpenStreetMap-Mitwirkende, Kartengrundlage © Esri.",
    map: "Karte der Fahrzeiten zum Büro", doc: "Pendeln zu AS+P",
    buffer: "Mittlere Verspätung je Abschnitt:",
    vTime: "Fahrzeit", vRisk: "Verspätungsrisiko",
    riskPeople: "Einwohner, die früher losmüssen",
    riskRows: ["+5 min", "+10 min", "+20 min"],
    riskLegend: ["+5", "+10", "+20 min oder unerreichbar"],
    riskNote: "Pink: wie viel früher man losgehen muss als laut Fahrplan, um so oft wie oben gewählt pünktlich zu sein. Linien: Fahrzeitzonen.",
    riskOff: "Wählen Sie oben eine Zuverlässigkeit über „Fahrplan“, um zu sehen, wo Verspätungen am meisten kosten.",
    vs: d => d >= 99 ? "bei dieser Zuverlässigkeit unerreichbar" : `+${d} min gegenüber Fahrplan`,
    modes: { "S-Bahn": "S-Bahn", "Regional rail": "Regionalzug", "U-Bahn": "U-Bahn", "Tram": "Tram", "Bus": "Bus" },
    levels: ["Fahrplan", "1 von 2 Tagen", "4 von 5 Tagen", "9 von 10 Tagen", "19 von 20 Tagen"],
    hints: ["Fahrplanzeiten: was die Fahrplanauskunft verspricht.",
            "Pünktlich an einem typischen Tag: jeder zweite Morgen läuft schlechter.",
            "Pünktlich an 4 von 5 Morgen: etwa einmal pro Woche zu spät.",
            "Pünktlich an 9 von 10 Morgen: etwa zweimal im Monat zu spät.",
            "Pünktlich an 19 von 20 Morgen: etwa einmal im Monat zu spät."],
    num: n => n >= 1e6 ? (n / 1e6).toFixed(2).replace(".", ",") + " Mio." : Math.round(n / 1000) + " Tsd.",
    leave: (t, tt) => `spätestens um ${t} losgehen · laut Fahrplan ${tt} min`,
    far: tt => tt <= 60 ? `laut Fahrplan: ${tt} min` : "oder zu weit zur nächsten Haltestelle",
  },
};
// language: ?lang= in the URL, else the last choice, else the browser's
function saved() { try { return localStorage.getItem("lang"); } catch (e) { return null; } }
const asked = new URLSearchParams(location.search).get("lang");
let lang = asked in T ? asked : saved() in T ? saved()
         : (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";
let redraw = () => {};
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  document.documentElement.lang = l; document.title = T[l].doc;
  document.querySelectorAll("[data-i]").forEach(el => el.innerHTML = T[l][el.dataset.i]);
  document.getElementById("map").setAttribute("aria-label", T[l].map);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  redraw();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
setLang(lang);

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

const map = L.map("map", { zoomControl: false, attributionControl: true, minZoom: 9, maxZoom: 15 });
L.control.zoom({ position: "topright" }).addTo(map);
// Esri's dark canvas: free with attribution and no key (CARTO now watermarks keyless use)
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
L.tileLayer(ESRI + "World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: 'Basemap © <a href="https://www.esri.com">Esri</a>, HERE, Garmin, © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 16 }).addTo(map);
const labels = L.tileLayer(ESRI + "World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16, pane: "shadowPane", opacity: .9 });

let view = "time";
function legend() {
  const cols = view === "time" ? COLORS : RISK_COLORS;
  const labels = view === "time" ? BANDS.map((b, i) => i === BANDS.length - 1 ? b + " min" : b) : T[lang].riskLegend;
  const l = document.getElementById("legend"), ll = document.getElementById("legend-l");
  l.style.gridTemplateColumns = ll.style.gridTemplateColumns = `repeat(${cols.length}, 1fr)`;
  l.innerHTML = cols.map(c => `<div style="background:${c}"></div>`).join("");
  ll.innerHTML = labels.map(t => `<span>${t}</span>`).join("");
}

fetch("data.json").then(r => r.json()).then(D => {
  const active = new Uint32Array(b64(D.active).buffer);
  const [s, w] = [D.box[0], D.box[1]];
  const n = s + D.rows * D.dlat, e = w + D.cols * D.dlon;
  const bounds = [[s, w], [n, e]];
  const [olat, olon] = D.office;
  map.setView([olat + .01, olon - .02], 11);
  if (innerWidth <= 720) map.setView([olat - .09, olon], 10);
  labels.addTo(map);

  // bands as vector rings: translucent fill, solid outline
  const bandLayer = L.layerGroup().addTo(map);
  const grid = new Float64Array(D.rows * D.cols);
  const contour = d3.contours().size([D.cols, D.rows]).smooth(true);
  const toLatLng = ring => ring.map(([x, y]) => [s + y * D.dlat, w + x * D.dlon]);

  L.marker([olat, olon], { icon: L.divIcon({ className: "", iconSize: [56, 56], iconAnchor: [28, 28],
    html: '<div class="office"><img src="asp_logo_black.png" alt="AS+P"></div>' }),
    title: "AS+P · Hedderichstraße 108–110", keyboard: false, zIndexOffset: 1000 }).addTo(map);
  const popcells = new Uint16Array(b64(D.popcells).buffer);
  const riskLayer = L.layerGroup().addTo(map);
  const grid2 = new Float64Array(D.rows * D.cols);

  const rel = document.getElementById("rel"), arr = document.getElementById("arr");
  let cur = null;
  function draw() {
    const level = D.levels[rel.value], time = D.arrivals[arr.value];
    document.getElementById("relv").textContent = T[lang].levels[rel.value];
    document.getElementById("relh").textContent = T[lang].hints[rel.value];
    const md = D.mode_delay[level], dec = v => lang === "de" ? v.toFixed(1).replace(".", ",") : v.toFixed(1);
    document.getElementById("modes").innerHTML = +rel.value === 0 ? "" :
      `<span class="lbl">${T[lang].buffer}</span>` +
      Object.keys(md).sort((a, b) => md[b] - md[a])
        .map(m => `<span>${T[lang].modes[m] || m}<b>+${dec(md[m])} min</b></span>`).join("");
    document.getElementById("arrv").textContent = time;
    cur = b64(D.scenarios[`${time}|${level}`]);
    const base = b64(D.scenarios[`${time}|${D.levels[0]}`]);
    legend();

    // travel time rings on minus minutes, so "within b min" is ">= -b"
    grid.fill(-999);
    for (let i = 0; i < active.length; i++) if (cur[i] <= 60) grid[active[i]] = -cur[i];
    rings(bandLayer, grid, BANDS.map(b => -b - 0.5), i => {
      const k = BANDS.length - 1 - i;                          // rings come out far to near
      return { color: COLORS[k], weight: 1.4, opacity: view === "time" ? .95 : .55,
               fillColor: COLORS[k], fillOpacity: view === "time" ? FILL[k] : 0 };
    });

    // delay risk: extra minutes over the timetable; lost within the hour counts as 99
    riskLayer.clearLayers();
    const people = [0, 0, 0];
    if (view === "risk" && +rel.value > 0) {
      grid2.fill(-999);
      for (let i = 0; i < active.length; i++) {
        if (base[i] > 60) continue;
        const d = cur[i] > 60 ? 99 : cur[i] - base[i];
        grid2[active[i]] = d;
        RISK.forEach((r, k) => { if (d >= r) people[k] += popcells[i]; });
      }
      rings(riskLayer, grid2, RISK.map(r => r - 0.5), i => (
        { color: RISK_COLORS[i], weight: 1.2, opacity: .9, fillColor: RISK_COLORS[i], fillOpacity: RISK_FILL[i] }));
    }

    const stats = document.getElementById("rows"), note = document.querySelector('[data-i="note"]'), head = document.querySelector('[data-i="people"]');
    if (view === "risk") {
      head.textContent = T[lang].riskPeople;
      note.textContent = +rel.value > 0 ? T[lang].riskNote : T[lang].riskOff;
      const max = Math.max(1, ...people);
      stats.innerHTML = +rel.value === 0 ? "" : RISK.map((r, k) => `<div class="row"><span class="k">${T[lang].riskRows[k]}</span>
        <span class="bar"><i style="width:${people[k] / max * 100}%;background:${RISK_COLORS[k]}"></i></span>
        <span class="v">${T[lang].num(people[k])}</span></div>`).join("");
      return;
    }
    head.textContent = T[lang].people; note.textContent = T[lang].note;
    const nowP = D.pop[`${time}|${level}`], baseP = D.pop[`${time}|${D.levels[0]}`];
    const max = Math.max(...baseP);
    stats.innerHTML = BANDS.map((b, k) => {
      const i = D.bands.indexOf(b), loss = baseP[i] ? 1 - nowP[i] / baseP[i] : 0;
      return `<div class="row"><span class="k">${b} min</span>
        <span class="bar"><i class="ghost" style="width:${baseP[i] / max * 100}%"></i><i style="width:${nowP[i] / max * 100}%;background:${COLORS[k]}"></i></span>
        <span class="v">${T[lang].num(nowP[i])}${rel.value > 0 && loss > 0.005 ? `<span class="d">−${Math.round(loss * 100)}%</span>` : ""}</span></div>`;
    }).join("");
  }

  // nested contour rings: each ring is its contour minus the next one in (even-odd)
  function rings(layer, values, thresholds, style) {
    layer.clearLayers();
    const shapes = contour.thresholds(thresholds)(values).sort((a, b) => a.value - b.value);
    shapes.forEach((sh, k) => {
      const inner = k + 1 < shapes.length ? shapes[k + 1].coordinates : [];
      const polys = sh.coordinates.concat(inner).map(poly => poly.map(toLatLng));
      if (polys.length) L.polygon(polys, { ...style(k), fillRule: "evenodd", interactive: false, smoothFactor: 0.6 }).addTo(layer);
    });
  }
  document.querySelectorAll(".view button").forEach(btn => btn.addEventListener("click", () => {
    view = btn.dataset.view;
    document.querySelectorAll(".view button").forEach(b => b.setAttribute("aria-pressed", b === btn));
    map.closePopup(); draw();
  }));
  document.querySelector('.view button[data-view="time"]').setAttribute("aria-pressed", "true");
  rel.addEventListener("input", draw); arr.addEventListener("input", draw);
  redraw = () => { map.closePopup(); draw(); };
  draw();

  const index = new Map(); active.forEach((c, i) => index.set(c, i));
  map.on("click", ev => {
    const r = Math.floor((ev.latlng.lat - s) / D.dlat), c = Math.floor((ev.latlng.lng - w) / D.dlon);
    const i = index.get(r * D.cols + c);
    const time = D.arrivals[arr.value];
    const here = i === undefined ? 255 : cur[i];
    const tt = i === undefined ? 255 : b64(D.scenarios[`${time}|${D.levels[0]}`])[i];
    const leave = m => { const [h, mm] = time.split(":").map(Number); const t = h * 60 + mm - m; return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
    const html = here > 60
      ? `<div class="pop-t">60+ min</div><div class="pop-s">${T[lang].far(tt)}</div>`
      : `<div class="pop-t">${here} min</div><div class="pop-s">${T[lang].leave(leave(here), tt)}</div>`;
    const extra = view === "risk" && tt <= 60 && +rel.value > 0
      ? `<div class="pop-s" style="color:#FF86BD;margin-top:4px">${T[lang].vs(here > 60 ? 99 : here - tt)}</div>` : "";
    L.popup({ closeButton: false }).setLatLng(ev.latlng).setContent(html + extra).openOn(map);
  });
});
</script>
</body>
</html>
